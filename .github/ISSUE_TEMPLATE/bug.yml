name: Bug report
description: Something does not behave as documented
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: value
    attributes:
      label: Value this delivers
      description: One sentence a user could witness once this is fixed.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The hosted app (app.guard-core.com), the playground, or the library and its version.
      placeholder: "app.guard-core.com, Events page"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. For a detection, include the event ID or the detection name. Never paste credentials, API keys or tokens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser or runtime, consistent or intermittent, workarounds tried.
